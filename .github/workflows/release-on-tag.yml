name: Release On Tag

on:
  push:
    tags:
      - "v*"
      - "V*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag (e.g. vX.Y.Z)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            platform: windows/amd64
            package_suffix: windows-x64
          - name: windows-arm64
            os: windows-latest
            platform: windows/arm64
            package_suffix: windows-arm64
          - name: macos-universal
            os: macos-latest
            platform: darwin/universal
            package_suffix: macos-universal
          - name: linux-amd64
            os: ubuntu-latest
            platform: linux/amd64
            package_suffix: linux-amd64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize version and platform labels
        id: normalize
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            raw_tag="${{ github.event.inputs.tag }}"
          else
            raw_tag="${GITHUB_REF_NAME}"
          fi

          version="${raw_tag#v}"
          version="${version#V}"
          platform_tag="${{ matrix.platform }}"
          platform_tag="${platform_tag/windows\//}"
          platform_tag="${platform_tag/amd64/x64}"

          echo "raw_tag=$raw_tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "platform_tag=$platform_tag" >> "$GITHUB_OUTPUT"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Windows build dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nsis jq -y

      - name: Configure Windows toolchain for target arch
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if ("${{ matrix.platform }}" -eq "windows/arm64") {
            choco install zig -y
            "CGO_ENABLED=1" | Out-File -FilePath $env:GITHUB_ENV -Append
            "CC=zig cc -target aarch64-windows-gnu" | Out-File -FilePath $env:GITHUB_ENV -Append
            "CXX=zig c++ -target aarch64-windows-gnu" | Out-File -FilePath $env:GITHUB_ENV -Append
            where.exe zig
          } else {
            "CGO_ENABLED=1" | Out-File -FilePath $env:GITHUB_ENV -Append
          }

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libgtk-3-dev \
            libjavascriptcoregtk-4.1-dev \
            libwebkit2gtk-4.1-dev \
            libglib2.0-dev \
            pkg-config \
            zip

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build app with Wails (Linux)
        if: runner.os == 'Linux'
        run: wails build -clean -platform "${{ matrix.platform }}" -tags webkit2_41

      - name: Build app with Wails (Windows Portable)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          wails build -clean -platform "${{ matrix.platform }}" -webview2 embed

      - name: Build app with Wails (Windows Installer)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          wails build -clean -platform "${{ matrix.platform }}" -webview2 embed -nsis

      - name: Build app with Wails (macOS)
        if: runner.os == 'macOS'
        run: wails build -clean -platform "${{ matrix.platform }}"

      - name: Smoke test Windows x64 executable
        if: runner.os == 'Windows' && matrix.platform == 'windows/amd64'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = "build/bin/AmphiDB.exe"
          if (-not (Test-Path $exe)) {
            $exe = (Get-ChildItem -Path build/bin -Filter *.exe | Where-Object { $_.Name -notmatch 'installer' } | Select-Object -First 1).FullName
          }
          if (-not $exe) {
            throw "No portable executable found for smoke test"
          }

          $p = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 8
          if ($p.HasExited) {
            Write-Host "::warning::Windows x64 smoke test: process exited immediately on CI runner. This can happen on non-interactive sessions and is treated as non-blocking."
          } else {
            Stop-Process -Id $p.Id -Force
          }

      - name: Package build output (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          $version = "${{ steps.normalize.outputs.version }}"
          $platformTag = "${{ steps.normalize.outputs.platform_tag }}"
          $portableName = "AmphiDB_Portable_${version}_${platformTag}.zip"

          # Package portable binary (exclude installer exe)
          $exe = "build/bin/AmphiDB.exe"
          if (-not (Test-Path $exe)) {
            $exe = (Get-ChildItem -Path build/bin -Filter *.exe | Where-Object { $_.Name -notmatch 'installer' } | Select-Object -First 1).FullName
          }
          if (-not $exe) {
            throw "No executable found in build/bin"
          }
          Compress-Archive -Path $exe -DestinationPath "dist/$portableName" -Force

          # Package installer if produced
          $installer = Get-ChildItem -Path build/bin -Filter *installer*.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($installer) {
            $installerName = "AmphiDB_Setup_${version}_${platformTag}.exe"
            Copy-Item $installer.FullName "dist/$installerName"
          }

      - name: Package build output (macOS/Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          TAG="${GITHUB_REF_NAME}"
          NAME="AmphiDB-${TAG}-${{ matrix.package_suffix }}.zip"
          cd build/bin
          zip -r "../../dist/${NAME}" .

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package_suffix }}
          path: |
            dist/*.zip
            dist/*.exe
          if-no-files-found: error

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release and upload packages
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/*.exe

name: Release On Tag

on:
  push:
    tags:
      - "v*"
      - "V*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x86
            os: windows-latest
            platform: windows/386
            package_suffix: windows-x86
          - name: windows-arm64
            os: windows-latest
            platform: windows/arm64
            package_suffix: windows-arm64
          - name: macos-universal
            os: macos-latest
            platform: darwin/universal
            package_suffix: macos-universal
          - name: linux-amd64
            os: ubuntu-latest
            platform: linux/amd64
            package_suffix: linux-amd64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libgtk-3-dev \
            libjavascriptcoregtk-4.1-dev \
            libwebkit2gtk-4.1-dev \
            libglib2.0-dev \
            pkg-config \
            zip

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build app with Wails (Linux)
        if: runner.os == 'Linux'
        run: wails build -clean -platform "${{ matrix.platform }}" -tags webkit2_41

      - name: Build app with Wails (Non-Linux)
        if: runner.os == 'Windows'
        run: wails build -clean -platform "${{ matrix.platform }}" -webview2 embed

      - name: Build app with Wails (macOS)
        if: runner.os == 'macOS'
        run: wails build -clean -platform "${{ matrix.platform }}"

      - name: Package build output (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          $tag = "${{ github.ref_name }}"
          $name = "AmphiDB-$tag-${{ matrix.package_suffix }}.zip"

          # Prefer AmphiDB.exe, fallback to the first .exe in build/bin
          $exe = "build/bin/AmphiDB.exe"
          if (-not (Test-Path $exe)) {
            $exe = (Get-ChildItem -Path build/bin -Filter *.exe | Select-Object -First 1).FullName
          }
          if (-not $exe) {
            throw "No executable found in build/bin"
          }

          Compress-Archive -Path $exe -DestinationPath "dist/$name" -Force

      - name: Package build output (macOS/Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          TAG="${GITHUB_REF_NAME}"
          NAME="AmphiDB-${TAG}-${{ matrix.package_suffix }}.zip"
          cd build/bin
          zip -r "../../dist/${NAME}" .

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package_suffix }}
          path: dist/*.zip
          if-no-files-found: error

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release and upload packages
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*.zip
